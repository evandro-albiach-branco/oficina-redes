<style>
  :root{
    --night:#0B2A45; --deep:#030a16; --ink:#fff; --ink-soft:#B9CBDD;
    --mint:#5FE0C6; --mint2:#9BF3DC; --amber:#FFC24D; --dim:#3f6f86;
    --display:"Anton",system-ui,sans-serif; --body:"Poppins",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(60% 50% at 82% 10%, rgba(139,108,240,.16), transparent 60%),
      radial-gradient(55% 55% at 6% 94%, rgba(255,194,77,.08), transparent 60%),
      radial-gradient(120% 95% at 70% 10%, #113d61 0%, #0B2A45 38%, #061a30 72%, #030a16 100%);
    min-height:100vh;
  }
  #root{min-height:100vh; display:flex; flex-direction:column}
  a{color:var(--mint2)}
  .brand{font-weight:700; letter-spacing:.2em; font-size:11px; color:var(--ink-soft); text-transform:uppercase; padding:18px 20px 0}
  .brand .ea{color:var(--mint)}

  .stagewrap{max-width:1400px; margin:0 auto; padding:18px 28px 28px; width:100%; flex:1}
  .card{background:rgba(255,255,255,.04); border:1px solid rgba(146,235,208,.14); border-radius:16px; padding:20px; margin-top:16px}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px;
    padding:13px 18px; font-family:var(--body); font-weight:600; font-size:15px; cursor:pointer; width:100%;
    background:var(--mint); color:#04231c; transition:transform .15s, opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn.secondary{background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(146,235,208,.25)}

  input[type=text]{width:100%; padding:13px 14px; border-radius:10px; border:1px solid rgba(146,235,208,.25);
    background:rgba(255,255,255,.06); color:var(--ink); font-family:var(--body); font-size:15px; outline:none}
  input[type=text]:focus{border-color:var(--mint)}
  label{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:6px}

  .seg button{flex:1; padding:11px 8px; background:transparent; color:var(--ink-soft); border:none; font-family:var(--body); font-weight:600; font-size:13px; cursor:pointer}

  .cmp-head span:nth-child(2), .cmp-head span:nth-child(3){text-align:center}

  .lineSwatch{width:18px;height:0;border-top:2px solid; display:inline-block}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0f3550; color:#fff; padding:10px 18px;
    border-radius:30px; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:50; border:1px solid rgba(146,235,208,.3)}
  .top-nav{display:flex; justify-content:space-between; align-items:center; padding:0 0 2px}

<body>

<script>
"use strict";
(function(){

// Preencha estas duas linhas com os valores do seu projeto Supabase
// (Project Settings -> API -> Project URL / anon public key).
var SUPABASE_URL = "https://covcbvhrihsstozlnrqp.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_hGbwDVlICflZXlIFYKiQVA_qb6zPauK";

var sb=null, isAdmin=false;
var state={
  phase:"coleta",
  participants:[], // {id, name}
  ties:[],         // {id, from, fromName, to, external, hypothetical, createdAt}
  loaded:false
};
// multi-oficina (sessão) support: cada evento tem seu próprio código e seus
// próprios participantes/laços, isolados por session_id
var currentSession=null; // {id, code, name, phase}
var notFoundCode=null;
var sessionsList=[];
var sessionsListLoaded=false;
var sessionChannel=null;
// layout de organização topológica do grafo, escolhido no palco — persiste
// entre re-renders (dados chegando ao vivo) até alguém trocar de novo
var graphLayout="force";

function parseHash(){
  var hRaw=(location.hash||"").replace("#","");
  var m=hRaw.match(/^(palco|entrar)(?:-(.+))?$/);
  if(!m) return {view:"entrar", code:null};
  return {view:m[1], code:m[2]? m[2].trim().toUpperCase() : null};
}

// transforma um nome digitado (com acentos/espaços/pontuação) no código da
// oficina: maiúsculas, sem acento, só letras/números, palavras separadas por
// hífen — assim o código é o próprio nome, fácil de falar e digitar em grupo
function slugifyCode(s){
  s=(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.toUpperCase().trim().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if(s.length>40) s=s.slice(0,40).replace(/-+$/,"");
  return s;
}

function h(tag, attrs, children){
  var el=document.createElement(tag);
  attrs=attrs||{};
  for(var k in attrs){
    if(k==="html"){ el.innerHTML=attrs[k]; }
    else if(k.indexOf("on")===0){ el.addEventListener(k.slice(2), attrs[k]); }
    else if(k==="class"){ el.className=attrs[k]; }
    else { el.setAttribute(k, attrs[k]); }
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c==="string"){ el.appendChild(document.createTextNode(c)); }
    else el.appendChild(c);
  });
  return el;
}
function text(node, str){ node.textContent=str; return node; }

function normName(s){
  return (s||"").trim().replace(/\s+/g," ").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,""); // ignora acentos também
}

// distância de edição (Levenshtein) — usada só para sugerir nomes parecidos,
// nunca para decidir identidade de nó sozinha
function levenshtein(a,b){
  var m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev=new Array(n+1);
  for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){
    var cur=[i];
    for(var j2=1;j2<=n;j2++){
      var cost = a[i-1]===b[j2-1]? 0:1;
      cur[j2]=Math.min(prev[j2]+1, cur[j2-1]+1, prev[j2-1]+cost);
    }
    prev=cur;
  }
  return prev[n];
}

// heurística de "parecença" entre dois nomes já normalizados (sem acento/caixa):
// prefixo de um no outro (ex. "jose" dentro de "jose silva"), mesmo primeiro
// nome, ou poucos caracteres de diferença. Quanto menor o score, mais parecido.
function nameCloseness(nA, nB){
  if(!nA || !nB || nA===nB) return null;
  if(nA.length>=2 && nB.length>=2 && (nA.indexOf(nB)===0 || nB.indexOf(nA)===0)) return 0;
  var ta=nA.split(" "), tb=nB.split(" ");
  if(ta[0]===tb[0] && ta[0].length>=3) return 1;
  var d=levenshtein(nA,nB);
  var maxLen=Math.max(nA.length,nB.length);
  if(maxLen>=4 && d<=2) return 2+d;
  return null;
}

// dado um nome digitado e uma lista de nomes (com a grafia original) já
// conhecidos na oficina, devolve o mais parecido (grafia original) ou null
function suggestSimilarName(raw, knownRaws){
  var nTarget=normName(raw);
  if(!nTarget) return null;
  var best=null, bestScore=Infinity;
  knownRaws.forEach(function(cand){
    var score=nameCloseness(nTarget, normName(cand));
    if(score!=null && score<bestScore){ bestScore=score; best=cand; }
  });
  return best;
}

// nomes já conhecidos nesta oficina (participantes + quem já foi citado em
// laços), uma grafia por pessoa — usado para autocomplete e para a sugestão
// "você quis dizer...?"
function knownNames(){
  var seen={}, out=[];
  function add(nm){
    var k=normName(nm||"");
    if(k && !seen[k]){ seen[k]=1; out.push(nm.trim()); }
  }
  state.participants.forEach(function(p){ add(p.name); });
  state.ties.forEach(function(t){ add(t.fromName); add(t.to); });
  return out;
}

// ---------- graph + metrics ----------
function buildGraph(){
  var nodes={}; // key -> {key,label,inRoom,degree}
  var edgeMap={}; // "a|b" sorted -> {a,b,real,hyp}
  function ensure(label){
    var k=normName(label);
    if(!k) return null;
    if(!nodes[k]) nodes[k]={key:k,label:label.trim(),inRoom:false,degree:0};
    return k;
  }
  state.participants.forEach(function(p){
    var k=ensure(p.name);
    if(k) nodes[k].inRoom=true;
  });
  state.ties.forEach(function(t){
    var a=ensure(t.fromName||"");
    var b=ensure(t.to||"");
    if(!a||!b||a===b) return;
    if(!t.external){ /* target claimed to be in room; still don't force inRoom flag from a guess */ }
    var pairKey = a<b ? a+"|"+b : b+"|"+a;
    if(!edgeMap[pairKey]) edgeMap[pairKey]={a:a,b:b,real:false,hyp:false};
    if(t.hypothetical) edgeMap[pairKey].hyp=true; else edgeMap[pairKey].real=true;
  });
  var edges=Object.keys(edgeMap).map(function(k){ return edgeMap[k]; });
  // degree counted on real edges only (structural reading)
  edges.forEach(function(e){
    if(e.real){ nodes[e.a].degree++; nodes[e.b].degree++; }
  });
  return {nodes:nodes, edges:edges};
}

// includeHyp=false (padrão): só laços reais contam na estrutura — é a leitura
// "de verdade" da rede, usada no painel principal. includeHyp=true: laços
// hipotéticos também contam como se existissem, usada só para o comparativo
// "com e sem hipotéticos" da fase de exercício.
function computeMetrics(g, includeHyp){
  var keys=Object.keys(g.nodes);
  var n=keys.length;
  var realEdges=g.edges.filter(function(e){return includeHyp? (e.real||e.hyp) : e.real;});
  var m=realEdges.length;
  // grau recalculado aqui (em vez de usar g.nodes[k].degree, que é sempre só
  // de laços reais) para que a variante "com hipotéticos" tenha seu próprio grau
  var degreeHere={}; keys.forEach(function(k){ degreeHere[k]=0; });
  realEdges.forEach(function(e){ degreeHere[e.a]++; degreeHere[e.b]++; });
  var idx={}; keys.forEach(function(k,i){idx[k]=i;});
  // each adjacency entry carries the neighbor index and the pair-key of the edge used,
  // so the bridge search below can identify *which* edge is critical, not just count them
  var adj=keys.map(function(){return [];});
  realEdges.forEach(function(e){
    var pk = e.a<e.b ? e.a+"|"+e.b : e.b+"|"+e.a;
    adj[idx[e.a]].push({to:idx[e.b], pk:pk});
    adj[idx[e.b]].push({to:idx[e.a], pk:pk});
  });
  // components (union-find via BFS)
  var comp=new Array(n).fill(-1);
  var compSizes=[];
  for(var i=0;i<n;i++){
    if(comp[i]!==-1) continue;
    var c=compSizes.length, q=[i]; comp[i]=c; var size=0;
    while(q.length){
      var u=q.pop(); size++;
      adj[u].forEach(function(edge){ if(comp[edge.to]===-1){comp[edge.to]=c; q.push(edge.to);} });
    }
    compSizes.push(size);
  }
  var blocks=compSizes.length || 0;
  var giantSize=compSizes.length? Math.max.apply(null,compSizes):0;
  var giantIdx=compSizes.indexOf(giantSize);
  var nodeComponent={}; keys.forEach(function(k,i){ nodeComponent[k]=comp[i]; });

  // density (simple undirected graph)
  var density = n>1 ? (2*m)/(n*(n-1)) : 0;

  // average distance within giant component (BFS from each node there)
  var giantNodes=[]; for(var j=0;j<n;j++) if(comp[j]===giantIdx) giantNodes.push(j);
  var totalDist=0, pairs=0;
  giantNodes.forEach(function(s){
    var dist=new Array(n).fill(-1); dist[s]=0; var q=[s], qi=0;
    while(qi<q.length){
      var u=q[qi++];
      adj[u].forEach(function(edge){ if(dist[edge.to]===-1){ dist[edge.to]=dist[u]+1; q.push(edge.to);} });
    }
    giantNodes.forEach(function(t){ if(t>s && dist[t]>0){ totalDist+=dist[t]; pairs++; } });
  });
  var avgDist = pairs>0 ? totalDist/pairs : 0;

  // bridges (critical ties) via DFS low-link, only within edges with real=true
  // bridgeEdges maps the edge's pair-key -> true, so a specific node can later ask
  // "how many of my own edges are critical ties" instead of only a global count
  var bridgeEdges={};
  var disc=new Array(n).fill(-1), low=new Array(n).fill(-1);
  var timer=0;
  function dfs(u,parentPk){
    disc[u]=low[u]=timer++;
    adj[u].forEach(function(edge){
      var v=edge.to;
      if(edge.pk===parentPk) return; // don't walk straight back along the edge we arrived on
      if(disc[v]===-1){
        dfs(v,edge.pk);
        low[u]=Math.min(low[u],low[v]);
        if(low[v]>disc[u]) bridgeEdges[edge.pk]=true;
      } else {
        low[u]=Math.min(low[u],disc[v]);
      }
    });
  }
  for(var s2=0;s2<n;s2++) if(disc[s2]===-1) dfs(s2,null);
  var bridgeCount=Object.keys(bridgeEdges).length;

  // degree centralization (Freeman), no grau desta variante (real, ou real+hipotético)
  var maxDeg=0; keys.forEach(function(k){ if(degreeHere[k]>maxDeg) maxDeg=degreeHere[k]; });
  var sumDiff=0; keys.forEach(function(k){ sumDiff += (maxDeg-degreeHere[k]); });
  var denom=(n-1)*(n-2);
  var centralization = denom>0 ? sumDiff/denom : 0;
  if(centralization>1) centralization=1;

  return {
    n:n, m:m, blocks:blocks, giantSize:giantSize,
    density:density, avgDist:avgDist, bridges:bridgeCount,
    centralization:centralization,
    hypCount: g.edges.filter(function(e){return e.hyp;}).length,
    nodeComponent:nodeComponent, componentSizes:compSizes, giantIdx:giantIdx, bridgeEdges:bridgeEdges
  };
}

function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }

// per-node detail shown in the stage side panel when a node in the graph is clicked
function nodeDetails(key, g, metrics){
  var node=g.nodes[key];
  if(!node) return null;
  var hypDeg=0, bridgeDeg=0;
  g.edges.forEach(function(e){
    if(e.a!==key && e.b!==key) return;
    if(e.hyp) hypDeg++;
    if(e.real && metrics.bridgeEdges[pairKey(e.a,e.b)]) bridgeDeg++;
  });
  var compIdx = metrics.nodeComponent[key];
  var compSize = (compIdx!=null) ? metrics.componentSizes[compIdx] : null;
  var externalCount=0;
  state.ties.forEach(function(t){
    if(t.external && normName(t.fromName||"")===key) externalCount++;
  });
  return {
    label:node.label, inRoom:node.inRoom, degree:node.degree,
    hypDeg:hypDeg, bridgeDeg:bridgeDeg, compSize:compSize,
    isGiant: compIdx===metrics.giantIdx, externalCount:externalCount
  };
}

// ---------- rendering ----------
var root=document.getElementById("root");

function render(){
  root.innerHTML="";
  var route=parseHash();

  if(route.code){
    if(!sb){ /* sem config, nada a resolver — cai no fluxo normal abaixo */ }
    else if(route.code===notFoundCode){
      root.appendChild(brandBar());
      var w=h("div",{class:"wrap"});
      w.appendChild(h("div",{class:"card center"},[
        h("p",{class:"muted"},["Oficina não encontrada para o código \""+route.code+"\"."]),
        h("a",{class:"btn secondary", href: route.view==="palco"?"#palco":"#entrar", style:"margin-top:12px;display:inline-block;width:auto"},["Voltar"])
      ]));
      root.appendChild(w);
      return;
    }
    else if(!currentSession || currentSession.code!==route.code){
      root.appendChild(brandBar());
      root.appendChild(h("div",{class:"wrap center", style:"padding-top:30vh"},[h("span",{class:"muted"},["Carregando oficina…"])]));
      openSession(route.code, function(){ render(); });
      return;
    }
  }

  if(route.view==="palco") renderStage(route.code);
  else renderEntrar(route.code);
}
window.addEventListener("hashchange", render);

// resolve um código de oficina em currentSession (ou null se não existir),
// (re)assina o canal realtime correspondente e chama done() ao concluir
function openSession(code, done){
  sb.from("oficina_rede_sessions").select("*").eq("code",code).maybeSingle().then(function(res){
    if(res.error || !res.data){
      currentSession=null; notFoundCode=code;
      if(done) done(null);
      return;
    }
    notFoundCode=null;
    currentSession={id:res.data.id, code:res.data.code, name:res.data.name, phase:res.data.phase||"coleta"};
    subscribeSession();
    if(done) done(currentSession);
  });
}

function subscribeSession(){
  if(sessionChannel){ sb.removeChannel(sessionChannel); sessionChannel=null; }
  if(!currentSession) return;
  loadAll();
  sessionChannel=sb.channel("oficina-rede-session-"+currentSession.id)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_participants", filter:"session_id=eq."+currentSession.id}, loadAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_ties", filter:"session_id=eq."+currentSession.id}, loadAll)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_sessions", filter:"id=eq."+currentSession.id}, loadAll)
    .subscribe();
}

function brandBar(){
  return h("div",{class:"brand"},["MONITORA", h("span",{class:"ea"},["EA"]), " · OFICINA REDE"]);
}

function phaseBanner(){

// tela sem código: escolher uma oficina existente ou criar uma nova (só facilitador)
// apaga uma oficina inteira (dados + a própria sessão); afterDelete(err) é chamado
// ao final para quem precisar reagir (ex.: voltar para a lista de oficinas)
function deleteSession(s, triggerBtn, afterDelete){
  if(!confirm("Excluir a oficina \""+(s.name||s.code)+"\" e todos os seus dados (participantes e laços)? Isso não pode ser desfeito.")) return;
  if(triggerBtn) triggerBtn.disabled=true;
  Promise.all([
    sb.from("oficina_rede_ties").delete().eq("session_id", s.id),
    sb.from("oficina_rede_participants").delete().eq("session_id", s.id)
  ]).then(function(results){
    var err=results.find(function(r){return r.error;});
    if(err) return {error:err.error};
    return sb.from("oficina_rede_sessions").delete().eq("id", s.id);
  }).then(function(res){
    if(triggerBtn) triggerBtn.disabled=false;
    if(res.error){ toast("Erro ao excluir: "+res.error.message); if(afterDelete) afterDelete(res.error); return; }
    toast("Oficina excluída.");
    sessionsListLoaded=false;
    if(currentSession && currentSession.id===s.id){
      if(sessionChannel){ sb.removeChannel(sessionChannel); sessionChannel=null; }
      currentSession=null;
    }
    if(afterDelete) afterDelete(null); else render();
  });
}

function renderStage(code){
  var navKids=[brandBar()];
  var navRight=h("div",{style:"display:flex;align-items:center;gap:16px"});
  if(code){
    navRight.appendChild(h("a",{class:"small-link", href:"#palco"},["← trocar de oficina"]));
    navRight.appendChild(h("button",{class:"small-link", style:"background:none;border:none;cursor:pointer;padding:0;font-family:inherit", onclick:function(){
      toast("Atualizando…");
      loadAll();
    }},["↻ atualizar"]));
  }
  navRight.appendChild(h("a",{class:"small-link", href: code? "#entrar-"+code : "#entrar"},["ir para entrada →"]));
  navKids.push(navRight);
  var top=h("div",{class:"top-nav"}, navKids);
  root.appendChild(top);
  var wrap=h("div",{class:"stagewrap"});
  root.appendChild(wrap);

  if(!sb){
    wrap.appendChild(h("div",{class:"card"},["Configuração pendente: preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do index.html."]));
    return;
  }

  if(!code){
    renderSessionPicker(wrap);
    return;
  }

  var g=buildGraph();
  var metrics=computeMetrics(g);
  // só calculada quando há laços hipotéticos registrados — é a base do
  // comparativo "com e sem hipotéticos" mostrado mais abaixo
  var metricsHyp = metrics.hypCount>0 ? computeMetrics(g,true) : null;

  // ---- cabeçalho: título + QR/link de entrada ----
  var header=h("div",{style:"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:6px"});
  header.appendChild(h("div",{},[
    h("h1",{style:"font-size:34px"},["Observatório da Sala"]),
    h("div",{class:"muted", style:"margin-bottom:4px"},[(currentSession.name||"Oficina")+" · código "+currentSession.code]),
    phaseBanner()
  ]));

  var joinBox=h("div",{class:"join-pill"});
  var qrHolder=h("div",{id:"qr"});
  joinBox.appendChild(qrHolder);
  var joinUrl=location.origin+location.pathname+"#entrar-"+currentSession.code;
  joinBox.appendChild(h("div",{},[
    h("div",{class:"muted",style:"margin-bottom:4px"},["Entre pelo celular:"]),
    h("div",{class:"urltext"},[joinUrl])
  ]));
  header.appendChild(joinBox);
  wrap.appendChild(header);

  // ---- controles do facilitador — no topo da página, antes do grafo ----
  if(!isAdmin){
    wrap.appendChild(renderLoginCard());
  } else {
    var admin=h("div",{class:"card"});
    admin.appendChild(h("h3",{style:"font-size:15px;margin-bottom:10px"},["Controles do facilitador"]));
    var seg=h("div",{class:"seg"});
    ["coleta","exercicio","encerrado"].forEach(function(ph){
      var label={coleta:"Coleta",exercicio:"Exercício",encerrado:"Encerrar"}[ph];
      var b=h("button",{class: state.phase===ph?"active":"", onclick:function(){
        if(state.phase===ph) return; // já está nessa fase
        var previousPhase=currentSession.phase;
        // atualização otimista: destaca a fase na hora, sem esperar o tempo
        // real ir e voltar — se der erro, desfaz e avisa
        currentSession.phase=ph; state.phase=ph; render();
        sb.from("oficina_rede_sessions").update({phase:ph, updated_at:new Date().toISOString()}).eq("id",currentSession.id).then(function(res){
          if(res.error){
            currentSession.phase=previousPhase; state.phase=previousPhase; render();
            toast("Erro ao mudar de fase: "+res.error.message);
          }
        });
      }},[label]);
      seg.appendChild(b);
    });
    admin.appendChild(seg);
    admin.appendChild(h("div",{style:"height:10px"}));
    var row=h("div",{class:"row"});
    var exportBtn=h("button",{class:"btn secondary", onclick:function(){
      var payload=JSON.stringify({oficina:currentSession, participants:state.participants, ties:state.ties, metrics:metrics}, null, 2);
      var blob=new Blob([payload], {type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="oficina-rede-"+currentSession.code+"-"+Date.now()+".json";
      document.body.appendChild(a); a.click(); a.remove();
    }},["Exportar dados"]);
    var resetBtn=h("button",{class:"btn danger", onclick:function(){
      if(!confirm("Apagar os participantes e laços DESTA oficina ("+currentSession.code+")? Isso não pode ser desfeito.")) return;
      Promise.all([
        sb.from("oficina_rede_ties").delete().eq("session_id",currentSession.id),
        sb.from("oficina_rede_participants").delete().eq("session_id",currentSession.id)
      ]).then(function(results){
        var err=results.find(function(r){return r.error;});
        if(err){ toast("Erro: "+err.error.message); return; }
        toast("Dados desta oficina apagados.");

        if(!err){

          location.hash="#palco";
        }
      });
    }},["Excluir esta oficina"]);

  metricsGrid.appendChild(metricEl("Densidade", metrics.density.toFixed(2)));

  ]));

  // comparativo "sem laços hipotéticos" vs "com laços hipotéticos" — duas
  // áreas lado a lado, só aparece quando existe pelo menos um laço hipotético
  if(metricsHyp){
    var compareCard=h("div",{class:"card"});

    ]));

      ["Densidade", metrics.density.toFixed(2), metricsHyp.density.toFixed(2)],
      ["Distância média", metrics.avgDist? metrics.avgDist.toFixed(2):"—", metricsHyp.avgDist? metricsHyp.avgDist.toFixed(2):"—"],
      ["Laços críticos", String(metrics.bridges), String(metricsHyp.bridges)],
      ["Dependência", metrics.centralization.toFixed(2), metricsHyp.centralization.toFixed(2)]
    ];
    cmpRows.forEach(function(r){
      var changed = r[1]!==r[2];
      cmpTable.appendChild(h("div",{class:"cmp-row"+(changed?" cmp-changed":"")},[
        h("span",{class:"muted"},[r[0]]),
        h("span",{},[r[1]]),
        h("span",{},[r[2]])
      ]));
    });
    compareCard.appendChild(cmpTable);
    side.appendChild(compareCard);
  }

  var nodeInfoBox=h("div",{class:"card"});
  function renderNodeInfo(key){
    nodeInfoBox.innerHTML="";
    nodeInfoBox.appendChild(h("h3",{style:"font-size:15px;margin-bottom:8px"},["Detalhe do nó"]));
    if(!key){
      nodeInfoBox.appendChild(h("div",{class:"muted"},["Clique em uma pessoa no grafo para ver os detalhes dela."]));
      return;
    }
    var d=nodeDetails(key, g, metrics);
    if(!d){
      nodeInfoBox.appendChild(h("div",{class:"muted"},["Nó não encontrado — pode ter sido removido."]));
      return;
    }
    var rows=[
      ["Nome", d.label],
      ["Status", d.inRoom? "Na sala":"Pessoa de fora"],
      ["Grau (laços reais)", String(d.degree)],
      ["Grupo", d.compSize? (d.isGiant? "Maior grupo ("+d.compSize+" pessoas)" : "Grupo de "+d.compSize+(d.compSize>1?" pessoas":" pessoa")) : "—"],
      ["Laços críticos aqui", String(d.bridgeDeg)],
      ["Laços hipotéticos", String(d.hypDeg)],
      ["Laços externos declarados", String(d.externalCount)]
    ];
    rows.forEach(function(r){
      nodeInfoBox.appendChild(h("div",{style:"display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(146,235,208,.08);font-size:13px"},[
        h("span",{class:"muted"},[r[0]]), h("span",{style:"font-weight:600;text-align:right"},[r[1]])
      ]));
    });

    if(isAdmin){
      nodeInfoBox.appendChild(h("div",{style:"height:10px"}));
      nodeInfoBox.appendChild(h("label",{},["Mesclar com (mesma pessoa, nome diferente)"]));
      var otherLabels=Object.keys(g.nodes).filter(function(k2){return k2!==key;}).map(function(k2){ return g.nodes[k2].label; });
      nodeInfoBox.appendChild(h("datalist",{id:"mergeNamesList"}, otherLabels.map(function(n){ return h("option",{value:n}); })));
      var mergeInput=h("input",{type:"text", placeholder:"nome do outro nó", list:"mergeNamesList"});
      nodeInfoBox.appendChild(mergeInput);
      nodeInfoBox.appendChild(h("div",{style:"height:8px"}));
      var mergeBtn=h("button",{class:"btn secondary", onclick:function(){
        var typed=mergeInput.value.trim();
        if(!typed){ toast("Digite ou escolha o nome do outro nó"); return; }
        var targetKey=null;
        Object.keys(g.nodes).forEach(function(k2){
          if(k2!==key && normName(g.nodes[k2].label)===normName(typed)) targetKey=k2;
        });
        if(!targetKey){ toast("Pessoa não encontrada entre os nós atuais — escolha uma da lista."); return; }
        var targetLabel=g.nodes[targetKey].label;
        if(!confirm("Mesclar \""+d.label+"\" dentro de \""+targetLabel+"\"? Isso reescreve todos os registros para um nome só e não pode ser desfeito.")) return;
        mergeBtn.disabled=true;
        mergeNodes(key, targetLabel).then(function(){
          mergeBtn.disabled=false;
          toast("Nós mesclados.");
          renderNodeInfo(null);
          loadAll();
        }).catch(function(e){
          mergeBtn.disabled=false;
          toast("Erro ao mesclar: "+(e&&e.message? e.message : e));
        });
      }},["Mesclar nós"]);
      nodeInfoBox.appendChild(mergeBtn);
    }
  }
  renderNodeInfo(null);
  side.appendChild(nodeInfoBox);

  wrap.appendChild(grid);
  grid.insertBefore(graphBox, grid.firstChild);
  grid.appendChild(side);

  // QR code
  if(window.QRCode){
    try{ new QRCode(qrHolder, {text:joinUrl, width:104, height:104, colorDark:"#0B2A45", colorLight:"#ffffff"}); }
    catch(e){ qrHolder.textContent="QR indisponível"; }
  } else {
    qrHolder.style.display="flex"; qrHolder.style.alignItems="center"; qrHolder.style.justifyContent="center";
    qrHolder.style.color="#0B2A45"; qrHolder.style.fontSize="11px"; qrHolder.textContent="QR indisponível — use o link";
  }

  drawGraph(graphBox, g, function(key){
    renderNodeInfo(key);
  }, graphLayout);
}

// posiciona os nós para os layouts clássicos não-orgânicos: fixa x/y/fx/fy de
// cada nó antes da simulação começar. Para "force", não mexe em nada — a
// simulação orgânica de sempre decide as posições. Para "circular"/"radial",
// os nós ficam pinados na posição calculada (ainda dá pra arrastar à mão,
// igual já funciona em "force").
function layoutPositions(nodeArr, layout, w, hgt){
  var n=nodeArr.length;
  if(n===0 || layout==="force") return;
  var cx=w/2, cy=hgt/2;
  var ordered=nodeArr.slice().sort(function(a,b){ return b.degree-a.degree || a.label.localeCompare(b.label); });
  if(layout==="circular"){
    var radius=Math.max(60, Math.min(w,hgt)*0.38);
    ordered.forEach(function(d,i){
      var angle=(i/n)*2*Math.PI - Math.PI/2;
      d.x=d.fx=cx+radius*Math.cos(angle);
      d.y=d.fy=cy+radius*Math.sin(angle);
    });
  } else if(layout==="radial"){
    var maxDeg=0; nodeArr.forEach(function(d){ if(d.degree>maxDeg) maxDeg=d.degree; });
    var minR=Math.max(40, Math.min(w,hgt)*0.1), maxR=Math.max(minR+60, Math.min(w,hgt)*0.42);
    ordered.forEach(function(d,i){
      var angle=(i/n)*2*Math.PI - Math.PI/2;
      var ratio = maxDeg>0? d.degree/maxDeg : 0;
      var r = maxR - (maxR-minR)*ratio; // quem tem mais laços fica mais perto do centro
      d.x=d.fx=cx+r*Math.cos(angle);
      d.y=d.fy=cy+r*Math.sin(angle);
    });
  }
}

function drawGraph(container, g, onNodeClick, layout){
  if(!window.d3){ container.innerHTML="<div class='muted' style='padding:20px'>Biblioteca de grafo indisponível.</div>"; return; }
  var w=container.clientWidth||800, hgt=container.clientHeight||600;
  var svg=d3.select(container).append("svg").attr("width",w).attr("height",hgt).attr("viewBox","0 0 "+w+" "+hgt);
  svg.style("cursor","grab");

  var defs=svg.append("defs");
  var glow=defs.append("filter").attr("id","nodeglow").attr("x","-100%").attr("y","-100%").attr("width","300%").attr("height","300%");
  glow.append("feGaussianBlur").attr("stdDeviation","4").attr("result","b");
  var merge=glow.append("feMerge"); merge.append("feMergeNode").attr("in","b"); merge.append("feMergeNode").attr("in","SourceGraphic");

  var nodeArr=Object.keys(g.nodes).map(function(k){ return g.nodes[k]; });
  var linkArr=g.edges.map(function(e){ return {source:e.a, target:e.b, real:e.real, hyp:e.hyp}; });

  if(nodeArr.length===0){
    svg.append("text").attr("x",w/2).attr("y",hgt/2).attr("text-anchor","middle")
      .attr("fill","#B9CBDD").attr("font-family","Poppins").attr("font-size","16px")
      .text("Aguardando participantes…");
    return;
  }

  layoutPositions(nodeArr, layout||"force", w, hgt);

  // everything pannable/zoomable lives inside "viewport"; defs/filters stay outside it
  var viewport=svg.append("g").attr("class","viewport");

  var sim=d3.forceSimulation(nodeArr)
    .force("link", d3.forceLink(linkArr).id(function(d){return d.key;}).distance(90).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-170))
    .force("center", d3.forceCenter(w/2, hgt/2))
    .force("collide", d3.forceCollide(26));

  var link=viewport.append("g").selectAll("line").data(linkArr).enter().append("line")
    .attr("stroke", function(d){ return d.hyp? "#FFC24D" : "#5FE0C6"; })
    .attr("stroke-width", function(d){ return d.real? 2 : 1.6; })
    .attr("stroke-dasharray", function(d){ return d.hyp? "6 5" : null; })
    .attr("opacity", function(d){ return d.real? .85 : .7; });

  var node=viewport.append("g").selectAll("g").data(nodeArr).enter().append("g")
    .style("cursor","pointer");

  function rOf(d){ return 9+Math.min(14,d.degree*2.5); }

  node.append("circle")
    .attr("r", rOf)
    .attr("fill", function(d){ return d.inRoom? "#5FE0C6" : "#3f6f86"; })
    .attr("filter","url(#nodeglow)")
    .attr("stroke","none").attr("stroke-width",0);

  node.append("text")
    .text(function(d){ return d.label; })
    .attr("text-anchor","middle")
    .attr("dy", function(d){ return -(14+Math.min(14,d.degree*2.5)); })
    .attr("fill","#fff")
    .attr("font-family","Poppins").attr("font-weight","600")
    .attr("font-size","12px")
    .style("pointer-events","none");

  // pan + zoom on the whole canvas (mouse wheel / pinch / drag on empty space)
  var zoom=d3.zoom().scaleExtent([0.3,4]).on("zoom", function(event){
    viewport.attr("transform", event.transform);
  });
  svg.call(zoom);
  svg.on("dblclick.zoom", null);
  svg.on("dblclick", function(){
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
  });

  // drag individual nodes to reorganize the layout by hand; a dropped node stays
  // pinned where you left it (the rest of the graph keeps simulating around it)
  var drag=d3.drag()
    .on("start", function(event,d){
      if(!event.active) sim.alphaTarget(0.25).restart();
      d.fx=d.x; d.fy=d.y; d.__dragged=false;
      svg.style("cursor","grabbing");
    })
    .on("drag", function(event,d){
      d.fx=event.x; d.fy=event.y; d.__dragged=true;
    })
    .on("end", function(event,d){
      sim.alphaTarget(0);
      svg.style("cursor","grab");
    });
  node.call(drag);

  node.on("click", function(event,d){
    if(d.__dragged){ d.__dragged=false; return; }
    event.stopPropagation();
    node.select("circle")
      .attr("stroke", function(dd){ return dd.key===d.key? "#FFC24D":"none"; })
      .attr("stroke-width", function(dd){ return dd.key===d.key? 3:0; });
    if(typeof onNodeClick==="function") onNodeClick(d.key);
  });

  var hint=document.createElement("div");
  hint.className="graph-hint";
  hint.textContent="Arraste os nós para reorganizar · role para zoom · duplo clique para centralizar";
  container.appendChild(hint);

  sim.on("tick", function(){
    nodeArr.forEach(function(d){
      var r=rOf(d)+4;
      if(d.fx==null) d.x=Math.max(r, Math.min(w-r, d.x));
      if(d.fy==null) d.y=Math.max(r, Math.min(hgt-r, d.y));
    });
    link.attr("x1",function(d){return d.source.x;}).attr("y1",function(d){return d.source.y;})
        .attr("x2",function(d){return d.target.x;}).attr("y2",function(d){return d.target.y;});
    node.attr("transform", function(d){ return "translate("+d.x+","+d.y+")"; });
  });
}

// ---------- data wiring ----------
// local, per-browser id, por oficina — participantes nunca fazem login; é assim
// que "quem sou eu" persiste, sem misturar a mesma pessoa entre oficinas diferentes
function localId(code){
  var k="oficina_rede_my_id:"+(code||"_global");
  var v=localStorage.getItem(k);
  if(!v){
    v=(window.crypto&&crypto.randomUUID)? crypto.randomUUID() : ("id-"+Math.random().toString(36).slice(2)+Date.now());
    localStorage.setItem(k,v);
  }
  return v;
}

// reescreve participante(s) e laços cujo nome normaliza para sourceKey, usando
// canonicalLabel como grafia final — assim os dois nós viram um só no grafo
function mergeNodes(sourceKey, canonicalLabel){
  var ops=[];
  state.participants.forEach(function(p){
    if(normName(p.name)===sourceKey && p.name!==canonicalLabel){
      ops.push(sb.from("oficina_rede_participants").update({name:canonicalLabel}).eq("id",p.id));
    }
  });
  state.ties.forEach(function(t){
    if(normName(t.fromName)===sourceKey && t.fromName!==canonicalLabel){
      ops.push(sb.from("oficina_rede_ties").update({from_name:canonicalLabel}).eq("id",t.id));
    }
    if(normName(t.to)===sourceKey && t.to!==canonicalLabel){
      ops.push(sb.from("oficina_rede_ties").update({to_name:canonicalLabel}).eq("id",t.id));
    }
  });
  return Promise.all(ops).then(function(results){
    var err=results.find(function(r){ return r && r.error; });
    if(err) throw err.error;
  });
}

async function loadAll(){
  if(!currentSession){ state.participants=[]; state.ties=[]; state.loaded=true; render(); return; }
  var sid=currentSession.id;
  var p=await sb.from("oficina_rede_participants").select("*").eq("session_id",sid);
  var t=await sb.from("oficina_rede_ties").select("*").eq("session_id",sid);
  var s=await sb.from("oficina_rede_sessions").select("*").eq("id",sid).maybeSingle();
  if(p.error) console.error("participants",p.error);
  else state.participants=p.data.map(function(r){ return {id:r.id, name:r.name}; });
  if(t.error) console.error("ties",t.error);
  else state.ties=t.data.map(function(r){ return {
    id:r.id, from:r.from_id, fromName:r.from_name, to:r.to_name,
    external:!!r.external, hypothetical:!!r.hypothetical, createdAt:r.created_at
  }; });
  if(!s.error && s.data){
    currentSession.phase=s.data.phase||"coleta";
    currentSession.name=s.data.name;
    state.phase=currentSession.phase;
  }
  state.loaded=true;
  render();
}

async function init(){
  try{
    if(window.supabase && SUPABASE_URL.indexOf("__")!==0){
      sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var sess=await sb.auth.getSession();
      isAdmin=!!(sess && sess.data && sess.data.session);
      sb.auth.onAuthStateChange(function(event, session){ isAdmin=!!session; sessionsListLoaded=false; render(); });
    }
  }catch(e){ sb=null; }
  if(!location.hash) location.hash="#entrar";
  render();
}
init();

})();
