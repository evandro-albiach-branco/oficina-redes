<script>

(function(){

  phase:"coleta",
  participants:[], // {id, name}
  memberships:[],  // {id, participantId, key, name, listed}
  ties:[],         // {id, from, fromName, to, external, hypothetical, createdAt}

};
// multi-oficina (sessão) support: cada evento tem seu próprio código e seus
// próprios participantes/laços, isolados por session_id
var currentSession=null; // {id, code, name, phase}
var notFoundCode=null;
var sessionsList=[];
var sessionsListLoaded=false;
var sessionChannel=null;
// layout de organização topológica do grafo, escolhido no palco — persiste
// entre re-renders (dados chegando ao vivo) até alguém trocar de novo
var graphLayout="force";
// nós críticos destacados no grafo (liga/desliga no palco)
var showCritical=false;
// simulação "e se…?" (só no palco, só na fase Exercício, só neste navegador): chaves de nós retirados da visão
var simRemoved={};         // pessoas retiradas da rede simulada
var simCut={};             // laços retirados (chave a|b)
var simHypOff=false;       // true = rede simulada sem os laços hipotéticos
var simHypSkip={};         // laços hipotéticos desligados um a um
var viewMode="declarada";  // declarada | simulada | comparar (só o facilitador, só no Exercício)
var posCache={};           // posições dos nós, para a visão não saltar ao alternar entre redes
function resetSim(){ simRemoved={}; simCut={}; simHypOff=false; simHypSkip={}; }
function simEdited(){ return simHypOff || Object.keys(simRemoved).length>0 || Object.keys(simCut).length>0 || Object.keys(simHypSkip).length>0; }
var selectedKey=null;      // nó selecionado no grafo (sobrevive aos re-renders)
var sideTabMemory="metrics";
// rascunho do formulário do participante: sobrevive aos re-renders que chegam quando OUTRAS pessoas agem
var draft={name:"", to:"", ext:false, net:""};
var loading=false, loadAgain=false, loadTimer=null;
var renderedKey="", lastEntrarSig="";
var stageTab="colab";          // colab | vinc  (palco: rede de colaboração ou vínculo com redes de EA)
var lastPhaseSeen=null;
var vincMode="pessoas";        // pessoas | redes
var vincShowEmpty=true;        // mostrar redes da lista sem representante na sala
var vincSelected=null;         // rede selecionada (chave)

function parseHash(){
  var hRaw=(location.hash||"").replace("#","");
  var m=hRaw.match(/^(palco|entrar)(?:-(.+))?$/);
  if(!m) return {view:"entrar", code:null};
  return {view:m[1], code:m[2]? m[2].trim().toUpperCase() : null};
}

// transforma um nome digitado (com acentos/espaços/pontuação) no código da
// oficina: maiúsculas, sem acento, só letras/números, palavras separadas por
// hífen — assim o código é o próprio nome, fácil de falar e digitar em grupo
function slugifyCode(s){
  s=(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
  s=s.toUpperCase().trim().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if(s.length>40) s=s.slice(0,40).replace(/-+$/,"");
  return s;
}

function h(tag, attrs, children){
  var el=document.createElement(tag);
  attrs=attrs||{};
  for(var k in attrs){
    if(k==="html"){ el.innerHTML=attrs[k]; }
    else if(k.indexOf("on")===0){ el.addEventListener(k.slice(2), attrs[k]); }
    else if(k==="class"){ el.className=attrs[k]; }
    else { el.setAttribute(k, attrs[k]); }
  }
  (children||[]).forEach(function(c){
    if(c==null) return;
    if(typeof c==="string"){ el.appendChild(document.createTextNode(c)); }
    else el.appendChild(c);
  });
  return el;
}
function text(node, str){ node.textContent=str; return node; }

function normName(s){
  return (s||"").trim().replace(/\s+/g," ").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,""); // ignora acentos também
}

// distância de edição (Levenshtein) — usada só para sugerir nomes parecidos,
// nunca para decidir identidade de nó sozinha
function levenshtein(a,b){
  var m=a.length, n=b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev=new Array(n+1);
  for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){
    var cur=[i];
    for(var j2=1;j2<=n;j2++){
      var cost = a[i-1]===b[j2-1]? 0:1;
      cur[j2]=Math.min(prev[j2]+1, cur[j2-1]+1, prev[j2-1]+cost);
    }
    prev=cur;
  }
  return prev[n];
}

// heurística de "parecença" entre dois nomes já normalizados (sem acento/caixa):
// prefixo de um no outro (ex. "jose" dentro de "jose silva"), mesmo primeiro
// nome, ou poucos caracteres de diferença. Quanto menor o score, mais parecido.
function nameCloseness(nA, nB){
  if(!nA || !nB || nA===nB) return null;
  if(nA.length>=2 && nB.length>=2 && (nA.indexOf(nB)===0 || nB.indexOf(nA)===0)) return 0;
  var ta=nA.split(" "), tb=nB.split(" ");
  if(ta[0]===tb[0] && ta[0].length>=3) return 1;
  var d=levenshtein(nA,nB);
  var maxLen=Math.max(nA.length,nB.length);
  if(maxLen>=4 && d<=2) return 2+d;
  return null;
}

// dado um nome digitado e uma lista de nomes (com a grafia original) já
// conhecidos na oficina, devolve o mais parecido (grafia original) ou null
function suggestSimilarName(raw, knownRaws){
  var nTarget=normName(raw);
  if(!nTarget) return null;
  var best=null, bestScore=Infinity;
  knownRaws.forEach(function(cand){
    var score=nameCloseness(nTarget, normName(cand));
    if(score!=null && score<bestScore){ bestScore=score; best=cand; }
  });
  return best;
}

// nomes já conhecidos nesta oficina (participantes + quem já foi citado em
// laços), uma grafia por pessoa — usado para autocomplete e para a sugestão
// "você quis dizer...?"
function knownNames(){
  var seen={}, out=[];
  function add(nm){
    var k=normName(nm||"");
    if(k && !seen[k]){ seen[k]=1; out.push(nm.trim()); }
  }
  state.participants.forEach(function(p){ add(p.name); });
  state.ties.forEach(function(t){ add(t.fromName); add(t.to); });
  return out;
}

// ---------- graph + metrics ----------
// presença de cada pessoa tem duas fontes, por desenho da dinâmica da oficina:
// 1) "selfJoined" — ela mesma entrou pelo próprio celular (#entrar)
// 2) "declaredPresent" — alguém que já está na sala, ao lançar um laço,
//    marcou explicitamente "Nesta sala" para essa pessoa (em vez de "Fora
//    da sala") — isso também conta como presença confirmada, já que nem
//    todo mundo numa oficina presencial vai ter o próprio celular na mão
function buildGraph(){
  var nodes={}; // key -> {key,label,selfJoined,declaredPresent,inRoom,degree}
  var edgeMap={}; // "a|b" sorted -> {a,b,real,hyp}
  function ensure(label){
    var k=normName(label);
    if(!k) return null;
    if(!nodes[k]) nodes[k]={key:k,label:label.trim(),selfJoined:false,declaredPresent:false,inRoom:false,degree:0};
    return k;
  }
  state.participants.forEach(function(p){
    var k=ensure(p.name);
    if(k) nodes[k].selfJoined=true;
  });
  state.ties.forEach(function(t){
    var a=ensure(t.fromName||"");
    var b=ensure(t.to||"");
    if(!a||!b||a===b) return;
    if(!t.external) nodes[b].declaredPresent=true; // alguém da sala confirmou que esta pessoa também está presente
    var pairKey = a<b ? a+"|"+b : b+"|"+a;
    if(!edgeMap[pairKey]) edgeMap[pairKey]={a:a,b:b,real:false,hyp:false};
    if(t.hypothetical) edgeMap[pairKey].hyp=true; else edgeMap[pairKey].real=true;
  });
  Object.keys(nodes).forEach(function(k){
    nodes[k].inRoom = nodes[k].selfJoined || nodes[k].declaredPresent;
  });
  var edges=Object.keys(edgeMap).map(function(k){ return edgeMap[k]; });
  // degree counted on real edges only (structural reading)
  edges.forEach(function(e){
    if(e.real){ nodes[e.a].degree++; nodes[e.b].degree++; }
  });
  return {nodes:nodes, edges:edges};
}

// ---------- nós críticos ----------
// ruptura: a saída da pessoa separa blocos de 2+ pessoas; elo único: só deixa pessoas sem nenhuma ligação;
// ponte: entre as maiores intermediações; referência: entre as mais ligadas (cerca de 10% da rede cada)
var CRIT={
  "ruptura":{color:"#FF6B6B", icon:"◆", text:"ruptura: se sair, a rede se parte"},
  "elo único":{color:"#B07CFF", icon:"◇", text:"elo único: única ligação de outras pessoas"},
  "ponte":{color:"#5FE0C6", icon:"⇄", text:"ponte entre grupos"},
  "referência":{color:"#FFC24D", icon:"★", text:"referência: muito ligada"}
};
function analyzeCritical(keys, adj, degreeHere){
  var n=keys.length, map={}, i;
  keys.forEach(function(k){ map[k]={type:"", lost:0, pieces:0, isolated:0, betw:0, roles:[], primary:""}; });
  if(n<3) return {map:map, list:[]};
  // ruptura / elo único: simula a saída de cada pessoa com 2+ ligações
  for(var v=0; v<n; v++){
    if(adj[v].length<2) continue;
    var seen=new Array(n).fill(false); seen[v]=true; var sizes=[];
    adj[v].forEach(function(e0){
      if(seen[e0.to]) return;
      var size=0, stack=[e0.to]; seen[e0.to]=true;
      while(stack.length){
        var u=stack.pop(); size++;
        adj[u].forEach(function(e){ if(!seen[e.to]){ seen[e.to]=true; stack.push(e.to); } });
      }
      sizes.push(size);
    });
    if(sizes.length<2) continue;
    sizes.sort(function(a,b){ return b-a; });
    var rest=sizes.slice(1), c=map[keys[v]];
    c.pieces=sizes.length;
    c.lost=rest.reduce(function(a,b){ return a+b; },0);
    c.isolated=sizes.filter(function(z){ return z===1; }).length;
    c.type=rest.some(function(z){ return z>=2; })? "ruptura" : "elo único";
    c.roles.push(c.type);
  }
  // intermediação (Brandes, não dirigido, normalizada)
  var bc=new Array(n).fill(0);
  for(var s0=0; s0<n; s0++){
    var stk=[], P=[], sigma=new Array(n).fill(0), dist=new Array(n).fill(-1), q=[s0], qi=0;
    for(i=0;i<n;i++) P.push([]);
    sigma[s0]=1; dist[s0]=0;
    while(qi<q.length){
      var w=q[qi++]; stk.push(w);
      adj[w].forEach(function(e){
        if(dist[e.to]<0){ dist[e.to]=dist[w]+1; q.push(e.to); }
        if(dist[e.to]===dist[w]+1){ sigma[e.to]+=sigma[w]; P[e.to].push(w); }
      });
    }
    var delta=new Array(n).fill(0);
    while(stk.length){
      var x=stk.pop();
      P[x].forEach(function(p){ delta[p]+=(sigma[p]/sigma[x])*(1+delta[x]); });
      if(x!==s0) bc[x]+=delta[x];
    }
  }
  var norm=(n-1)*(n-2);
  keys.forEach(function(k,idx){ map[k].betw=norm>0? bc[idx]/norm : 0; });
  var kTop=Math.max(3, Math.ceil(n*0.1));
  function topSet(valFn, min){
    var set={};
    keys.slice().filter(function(k){ return valFn(k)>min; }).sort(function(a,b){ return valFn(b)-valFn(a); }).slice(0,kTop).forEach(function(k){ set[k]=true; });
    return set;
  }
  var topBridge=topSet(function(k){ return map[k].betw; }, 0.0001);
  var topRef=topSet(function(k){ return degreeHere[k]; }, 1);
  var list=[];
  function plural(num,a,b){ return num===1? a : b; }
  keys.forEach(function(k){
    var c=map[k];
    if(topBridge[k]) c.roles.push("ponte");
    if(topRef[k]) c.roles.push("referência");
    if(!c.roles.length) return;
    c.primary=c.type || (topBridge[k]? "ponte" : "referência");
    var why=[];
    if(c.type==="ruptura") why.push("Se sair, a rede se parte em "+c.pieces+" blocos e "+c.lost+" "+plural(c.lost,"pessoa fica separada","pessoas ficam separadas")+" do bloco principal.");
    if(c.type==="elo único") why.push("É a única ligação de "+c.isolated+" "+plural(c.isolated,"pessoa","pessoas")+": se sair, "+plural(c.isolated,"ela fica","elas ficam")+" sem nenhuma ligação.");
    if(topBridge[k]) why.push("Liga grupos diferentes (intermediação "+c.betw.toFixed(2)+").");
    if(topRef[k]) why.push("Tem "+degreeHere[k]+" ligações: apoio de muitos, e pode estar sobrecarregada.");
    var score=c.lost*3+c.isolated*2+(topBridge[k]?2:0)+(topRef[k]?1:0)+c.betw;
    list.push({key:k, roles:c.roles.slice(), primary:c.primary, why:why, score:score, lost:c.lost});
  });
  list.sort(function(a,b){ return b.score-a.score; });
  return {map:map, list:list.slice(0,15)};
}

// includeHyp=false (padrão): só laços reais contam na estrutura — é a leitura
// "de verdade" da rede, usada no painel principal. includeHyp=true: laços
// hipotéticos também contam como se existissem, usada só para o comparativo
// "com e sem hipotéticos" da fase de exercício.
function computeMetrics(g, includeHyp){
  var keys=Object.keys(g.nodes);
  var n=keys.length;
  var realEdges=g.edges.filter(function(e){return includeHyp? (e.real||e.hyp) : e.real;});
  var m=realEdges.length;
  // grau recalculado aqui (em vez de usar g.nodes[k].degree, que é sempre só
  // de laços reais) para que a variante "com hipotéticos" tenha seu próprio grau
  var degreeHere={}; keys.forEach(function(k){ degreeHere[k]=0; });
  realEdges.forEach(function(e){ degreeHere[e.a]++; degreeHere[e.b]++; });
  var idx={}; keys.forEach(function(k,i){idx[k]=i;});
  // each adjacency entry carries the neighbor index and the pair-key of the edge used,
  // so the bridge search below can identify *which* edge is critical, not just count them
  var adj=keys.map(function(){return [];});
  realEdges.forEach(function(e){
    var pk = e.a<e.b ? e.a+"|"+e.b : e.b+"|"+e.a;
    adj[idx[e.a]].push({to:idx[e.b], pk:pk});
    adj[idx[e.b]].push({to:idx[e.a], pk:pk});
  });
  // components (union-find via BFS)
  var comp=new Array(n).fill(-1);
  var compSizes=[];
  for(var i=0;i<n;i++){
    if(comp[i]!==-1) continue;
    var c=compSizes.length, q=[i]; comp[i]=c; var size=0;
    while(q.length){
      var u=q.pop(); size++;
      adj[u].forEach(function(edge){ if(comp[edge.to]===-1){comp[edge.to]=c; q.push(edge.to);} });
    }
    compSizes.push(size);
  }
  var blocks=compSizes.length || 0;
  var giantSize=compSizes.length? Math.max.apply(null,compSizes):0;
  var giantIdx=compSizes.indexOf(giantSize);
  var nodeComponent={}; keys.forEach(function(k,i){ nodeComponent[k]=comp[i]; });

  // density (simple undirected graph)
  var density = n>1 ? (2*m)/(n*(n-1)) : 0;

  // average distance within giant component (BFS from each node there)
  var giantNodes=[]; for(var j=0;j<n;j++) if(comp[j]===giantIdx) giantNodes.push(j);
  var totalDist=0, pairs=0;
  giantNodes.forEach(function(s){
    var dist=new Array(n).fill(-1); dist[s]=0; var q=[s], qi=0;
    while(qi<q.length){
      var u=q[qi++];
      adj[u].forEach(function(edge){ if(dist[edge.to]===-1){ dist[edge.to]=dist[u]+1; q.push(edge.to);} });
    }
    giantNodes.forEach(function(t){ if(t>s && dist[t]>0){ totalDist+=dist[t]; pairs++; } });
  });
  var avgDist = pairs>0 ? totalDist/pairs : 0;

  // bridges (critical ties) via DFS low-link, only within edges with real=true
  // bridgeEdges maps the edge's pair-key -> true, so a specific node can later ask
  // "how many of my own edges are critical ties" instead of only a global count
  var bridgeEdges={};
  var disc=new Array(n).fill(-1), low=new Array(n).fill(-1);
  var timer=0;
  function dfs(u,parentPk){
    disc[u]=low[u]=timer++;
    adj[u].forEach(function(edge){
      var v=edge.to;
      if(edge.pk===parentPk) return; // don't walk straight back along the edge we arrived on
      if(disc[v]===-1){
        dfs(v,edge.pk);
        low[u]=Math.min(low[u],low[v]);
        if(low[v]>disc[u]) bridgeEdges[edge.pk]=true;
      } else {
        low[u]=Math.min(low[u],disc[v]);
      }
    });
  }
  for(var s2=0;s2<n;s2++) if(disc[s2]===-1) dfs(s2,null);
  var bridgeCount=Object.keys(bridgeEdges).length;

  // degree centralization (Freeman), no grau desta variante (real, ou real+hipotético)
  var maxDeg=0; keys.forEach(function(k){ if(degreeHere[k]>maxDeg) maxDeg=degreeHere[k]; });
  var sumDiff=0; keys.forEach(function(k){ sumDiff += (maxDeg-degreeHere[k]); });
  var denom=(n-1)*(n-2);
  var centralization = denom>0 ? sumDiff/denom : 0;
  if(centralization>1) centralization=1;

  var crit=analyzeCritical(keys, adj, degreeHere);
  return {
    crit:crit,
    n:n, m:m, blocks:blocks, giantSize:giantSize,
    density:density, avgDist:avgDist, bridges:bridgeCount,
    centralization:centralization,
    hypCount: g.edges.filter(function(e){return e.hyp;}).length,
    nodeComponent:nodeComponent, componentSizes:compSizes, giantIdx:giantIdx, bridgeEdges:bridgeEdges
  };
}

function pairKey(a,b){ return a<b ? a+"|"+b : b+"|"+a; }

// Duas redes a partir da mesma base: a DECLARADA (só laços reais) e a SIMULADA (declarada + laços hipotéticos,
// menos os laços e as pessoas retirados). Nada disso toca o banco. "union" serve ao desenho da comparação.
function buildScenario(gFull){
  function copyNode(k){ var o={}; for(var f in gFull.nodes[k]) o[f]=gFull.nodes[k][f]; o.degree=0; return o; }
  var decl={nodes:{}, edges:[]}, sim={nodes:{}, edges:[]}, uni={nodes:{}, edges:[]};
  var added=0, cutN=0;
  Object.keys(gFull.nodes).forEach(function(k){
    decl.nodes[k]=copyNode(k); uni.nodes[k]=copyNode(k);
    if(!simRemoved[k]) sim.nodes[k]=copyNode(k); else uni.nodes[k].ghost=true;
  });
  gFull.edges.forEach(function(e){
    var key=pairKey(e.a,e.b), hypOnly=e.hyp && !e.real;
    if(e.real){ decl.edges.push({a:e.a,b:e.b,real:true,hyp:false,st:"kept",key:key}); decl.nodes[e.a].degree++; decl.nodes[e.b].degree++; }
    var alive=!simRemoved[e.a] && !simRemoved[e.b];
    var hypOn=hypOnly && !simHypOff && !simHypSkip[key];
    var inSim=(e.real || hypOn) && !simCut[key] && alive;
    if(inSim){
      var st=e.real? "kept" : "added";
      sim.edges.push({a:e.a,b:e.b,real:true,hyp:false,st:st,key:key}); sim.nodes[e.a].degree++; sim.nodes[e.b].degree++;
      uni.edges.push({a:e.a,b:e.b,real:true,hyp:false,st:st,key:key});
      if(!e.real) added++;
    } else if(e.real || (hypOnly && !simHypOff)){
      uni.edges.push({a:e.a,b:e.b,real:true,hyp:false,st:"cut",key:key}); cutN++;
    }
  });
  Object.keys(uni.nodes).forEach(function(k){ uni.nodes[k].degree = sim.nodes[k]? sim.nodes[k].degree : decl.nodes[k].degree; });
  return {decl:decl, sim:sim, union:uni, added:added, cut:cutN};
}


// ---- palco: vínculo com redes de EA (REBEA no centro, redes e pessoas ao redor) ----
function buildAffil(){
  var nets={}, people={};
  nets["rebea"]={key:"rebea", label:"REBEA", full:REBEA_ITEM.nome, cat:"rebea", listed:true, hub:true, members:[]};
  REDES_LISTA.forEach(function(r){ nets[r.key]={key:r.key, label:r.label, full:r.nome, cat:r.cat, listed:true, members:[]}; });
  state.participants.forEach(function(p){ people[p.id]={id:p.id, name:p.name, nets:[], plain:[]}; });
  state.memberships.forEach(function(m){
    var pe=people[m.participantId]; if(!pe) return;
    var n=nets[m.key];
    if(!n){ n=nets[m.key]={key:m.key, label:m.name, full:m.name, cat:"outras", listed:false, members:[]}; }
    if(n.members.indexOf(pe.id)<0){ n.members.push(pe.id); pe.nets.push(m.key); if(!n.hub) pe.plain.push(m.key); }
  });
  return {nets:nets, people:people};
}

  grid.appendChild(side);

  drawAffil(graphBox, A, {mode:vincMode, selected:vincSelected, onNet:function(k){ vincSelected=(vincSelected===k? null : k); sideTabMemory="v:redes"; render(); }});

function drawAffil(container, A, opts){
  if(!window.d3){ container.innerHTML="<div class='muted' style='padding:20px'>Biblioteca de grafo indisponível.</div>"; return; }
  var w=container.clientWidth||800, hgt=container.clientHeight||600;
  var svg=d3.select(container).append("svg").attr("width","100%").attr("height","100%").attr("viewBox","0 0 "+w+" "+hgt);
  svg.style("cursor","grab");
  var viewport=svg.append("g");
  var peopleMode=opts.mode==="pessoas";
  var peopleCount=Object.keys(A.people).filter(function(k){ return A.people[k].nets.length>0; }).length;

  var nodes=[], links=[];
  var rebea={id:"rebea", type:"rebea", label:"REBEA", fx:w/2, fy:hgt/2, x:w/2, y:hgt/2};
  nodes.push(rebea);
  var netNodes={};
  netNodes["rebea"]=rebea;
  Object.keys(A.nets).forEach(function(k){
    var n=A.nets[k];
    if(n.hub) return;
    if(n.members.length===0) return;
    var o={id:"n:"+k, type:"net", key:k, label:n.label, full:n.full, cat:n.cat, listed:n.listed, count:n.members.length};
    netNodes[k]=o; nodes.push(o);
    links.push({source:"rebea", target:o.id, kind:n.listed? "hub":"hubx"});
  });
  var memberOfSel={};
  if(opts.selected && A.nets[opts.selected]) A.nets[opts.selected].members.forEach(function(id){ memberOfSel[id]=true; });
  if(peopleMode){
    Object.keys(A.people).forEach(function(id){
      var p=A.people[id]; if(!p.nets.length) return;
      var o={id:"p:"+id, type:"person", pid:id, label:p.name, nets:p.nets, multi:p.plain.length>1};
      nodes.push(o);
      p.nets.forEach(function(k){ if(netNodes[k]) links.push({source:o.id, target:(k==="rebea"?"rebea":"n:"+k), kind:"member"}); });
    });
  } else {
    var pair={};
    Object.keys(A.people).forEach(function(id){
      var ns=A.people[id].plain;
      for(var i=0;i<ns.length;i++) for(var j=i+1;j<ns.length;j++){
        var a=ns[i], b=ns[j]; if(a>b){ var t=a; a=b; b=t; }
        pair[a+"|"+b]=(pair[a+"|"+b]||0)+1;
      }
    });
    Object.keys(pair).forEach(function(k){
      var ab=k.split("|"); if(netNodes[ab[0]] && netNodes[ab[1]]) links.push({source:"n:"+ab[0], target:"n:"+ab[1], kind:"shared", w:pair[k]});
    });
  }
  nodes.forEach(function(d){ var p=posCache["v:"+d.id]; if(p && d.type!=="rebea"){ d.x=p.x; d.y=p.y; } });
  function rOf(d){
    if(d.type==="rebea") return 32;
    if(d.type==="net") return 9+Math.sqrt(d.count)*6;
    return d.multi? 8.5 : 6;
  }
  var sim=d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function(d){ return d.id; })
      .distance(function(l){ return l.kind==="hub"? 190 : (l.kind==="hubx"? 230 : (l.kind==="shared"? 120 : 52)); })
      .strength(function(l){ return l.kind==="hub"? 0.35 : (l.kind==="hubx"? 0.25 : (l.kind==="shared"? 0.15 : 0.6)); }))
    .force("charge", d3.forceManyBody().strength(function(d){ return d.type==="net"? -420 : (d.type==="rebea"? -600 : -90); }).distanceMax(800))
    .force("x", d3.forceX(w/2).strength(0.045))
    .force("y", d3.forceY(hgt/2).strength(0.045))
    .force("collide", d3.forceCollide(function(d){ return rOf(d)+(d.type==="person"?3:10); }).iterations(2))
    .alphaDecay(0.02).velocityDecay(0.38);

  var sel=opts.selected;
  function dim(d){
    if(!sel) return false;
    if(d.type==="rebea") return false;
    if(d.type==="net") return d.key!==sel;
    return !memberOfSel[d.pid];
  }
  var link=viewport.append("g").selectAll("line").data(links).enter().append("line")
    .attr("stroke", function(d){ return d.kind==="shared"? "#FFC24D" : (d.kind==="member"? "#8FB7CF" : "#5FE0C6"); })
    .attr("stroke-width", function(d){ return d.kind==="shared"? 1.5+d.w*1.5 : (d.kind==="member"? 1.2 : 1.4); })
    .attr("stroke-dasharray", function(d){ return d.kind==="hubx"? "4 5" : null; })
    .attr("opacity", function(d){
      var base = d.kind==="member"? .55 : (d.kind==="shared"? .8 : .28);
      if(sel){
        var s=typeof d.source==="object"? d.source : {id:d.source}, t=typeof d.target==="object"? d.target : {id:d.target};
        var hid=(sel==="rebea"?"rebea":"n:"+sel); var on = (s.id===hid || t.id===hid);
        return on? .95 : .06;
      }
      return base;
    });
  var node=viewport.append("g").selectAll("g").data(nodes).enter().append("g").style("cursor", function(d){ return (d.type==="net"||d.type==="rebea")? "pointer":"grab"; });
  node.each(function(d){
    var g=d3.select(this);
    if(d.type==="rebea"){
      var hubN=A.nets["rebea"].members.length;
      g.append("circle").attr("r",32).attr("fill","#0F3B5F").attr("stroke", sel==="rebea"? "#FFFFFF":"#5FE0C6").attr("stroke-width",3);
      g.append("title").text("REBEA · "+A.nets["rebea"].full+(hubN? " · "+hubN+(hubN===1?" pessoa vinculada":" pessoas vinculadas") : ""));
      g.append("text").text("REBEA").attr("text-anchor","middle").attr("dy","0.35em").attr("fill","#fff").attr("font-family","Poppins").attr("font-weight","700").attr("font-size","13px").style("pointer-events","none");
    } else if(d.type==="net"){
      var r=rOf(d), col=REDE_CATS[d.cat].color;
      g.append("rect").attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r).attr("rx",4)
        .attr("fill", d.count? col : "none").attr("fill-opacity", d.count? .9 : 0)
        .attr("stroke", sel===d.key? "#FFFFFF" : col).attr("stroke-width", sel===d.key? 3 : (d.count? 1.5 : 1.5))
        .attr("stroke-dasharray", d.count? null : "3 3")
        .attr("opacity", dim(d)? .18 : (d.count? 1 : .55));
      g.append("text").text(d.label).attr("text-anchor","middle").attr("dy", -(r+5))
        .attr("fill", d.count? "#fff" : "#B9CBDD").attr("font-family","Poppins").attr("font-weight", d.count? "700":"500").attr("font-size", d.count? "11.5px":"10px")
        .attr("opacity", dim(d)? .2 : (d.count? 1 : .6)).style("pointer-events","none");
      g.append("title").text(d.full+(d.count? " · "+d.count+(d.count===1?" pessoa":" pessoas") : " · sem representante na sala"));
    } else {
      var rp=rOf(d);
      g.append("circle").attr("r",rp).attr("fill","#E6F4FF").attr("stroke", d.multi? "#FFC24D":"none").attr("stroke-width", d.multi? 3:0)
        .attr("opacity", dim(d)? .15 : 1);
      var showName = d.multi || (sel && memberOfSel[d.pid]) || peopleCount<=12;
      if(showName) g.append("text").text(d.label).attr("text-anchor","middle").attr("dy", -(rp+4)).attr("fill", d.multi? "#FFC24D":"#B9CBDD")
        .attr("font-family","Poppins").attr("font-size","10.5px").attr("font-weight", d.multi? "700":"500").attr("opacity", dim(d)? .15 : 1).style("pointer-events","none");
      g.append("title").text(d.label+" · "+d.nets.map(function(k){ return A.nets[k]? A.nets[k].label : k; }).join(", "));
    }
  });
  node.on("click", function(event,d){ if(d.__dragged){ d.__dragged=false; return; } if((d.type==="net"||d.type==="rebea") && opts.onNet){ event.stopPropagation(); opts.onNet(d.type==="rebea"? "rebea" : d.key); } });
  var zoom=d3.zoom().scaleExtent([0.3,4]).on("zoom", function(ev){ viewport.attr("transform", ev.transform); });
  svg.call(zoom); svg.on("dblclick.zoom", null);
  svg.on("dblclick", function(){ svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity); });
  svg.on("click", function(){ if(opts.selected && opts.onNet) opts.onNet(opts.selected); });
  node.call(d3.drag()
    .on("start", function(ev,d){ if(d.type==="rebea") return; if(!ev.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; d.__dragged=false; })
    .on("drag", function(ev,d){ if(d.type==="rebea") return; d.fx=ev.x; d.fy=ev.y; d.__dragged=true; })
    .on("end", function(ev,d){ sim.alphaTarget(0); }));
  var hint=document.createElement("div"); hint.className="graph-hint";
  hint.textContent="Clique numa rede para destacar · arraste os nós · role para zoom · duplo clique para centralizar";
  container.appendChild(hint);
  sim.on("tick", function(){
    nodes.forEach(function(d){
      if(d.type!=="rebea"){ var r=rOf(d)+14; if(d.fx==null) d.x=Math.max(r,Math.min(w-r,d.x)); if(d.fy==null) d.y=Math.max(r+8,Math.min(hgt-r,d.y)); }
      posCache["v:"+d.id]={x:d.x,y:d.y};
    });
    link.attr("x1",function(d){return d.source.x;}).attr("y1",function(d){return d.source.y;}).attr("x2",function(d){return d.target.x;}).attr("y2",function(d){return d.target.y;});
    node.attr("transform", function(d){ return "translate("+d.x+","+d.y+")"; });
  });
}

// per-node detail shown in the stage side panel when a node in the graph is clicked
function nodeDetails(key, g, metrics){
  var node=g.nodes[key];
  if(!node) return null;
  var hypDeg=0, bridgeDeg=0;
  g.edges.forEach(function(e){
    if(e.a!==key && e.b!==key) return;
    if(e.hyp) hypDeg++;
    if(e.real && metrics.bridgeEdges[pairKey(e.a,e.b)]) bridgeDeg++;
  });
  var compIdx = metrics.nodeComponent[key];
  var compSize = (compIdx!=null) ? metrics.componentSizes[compIdx] : null;
  var externalCount=0;
  state.ties.forEach(function(t){
    if(t.external && normName(t.fromName||"")===key) externalCount++;
  });
  return {
    label:node.label, inRoom:node.inRoom, selfJoined:node.selfJoined, degree:node.degree,
    hypDeg:hypDeg, bridgeDeg:bridgeDeg, compSize:compSize,
    isGiant: compIdx===metrics.giantIdx, externalCount:externalCount
  };
}

// ---------- rendering ----------
var root=document.getElementById("root");

// refaz a tela preservando o foco e o cursor do campo em uso (o rascunho já vive em "draft")
function render(){
  var a=document.activeElement, f=null;
  if(a && a.id && root.contains(a)) f={id:a.id, s:a.selectionStart, e:a.selectionEnd};
  renderNow();
  if(f){
    var el=document.getElementById(f.id);
    if(el){ el.focus(); try{ el.setSelectionRange(f.s,f.e); }catch(err){} }
  }
  var rt=parseHash();
  renderedKey = rt.view+"|"+(rt.code||"");
  lastEntrarSig = (rt.view==="entrar" && currentSession) ? entrarSig() : "";
}
function entrarSig(){
  var code=currentSession? currentSession.code : "";
  var myId=localId(code);
  var me=state.participants.find(function(p){ return p.id===myId; });
  var mine=state.ties.filter(function(t){ return t.from===myId; }).map(function(t){ return t.id; }).join(",");
  var mm=state.memberships.filter(function(m){ return m.participantId===myId; }).map(function(m){ return m.id; }).join(",");
  return [currentSession&&currentSession.id, state.phase, me? me.name : "", mine, mm].join("|");
}
function refreshDatalist(){
  var dl=document.getElementById("ofNamesList"); if(!dl) return;
  dl.innerHTML=""; knownNames().forEach(function(n){ dl.appendChild(h("option",{value:n})); });
}

function renderNow(){
  root.innerHTML="";
  var route=parseHash();

  if(route.code){
    if(!sb){ /* sem config, nada a resolver — cai no fluxo normal abaixo */ }
    else if(route.code===notFoundCode){
      root.appendChild(brandBar());
      var w=h("div",{class:"wrap"});
      w.appendChild(h("div",{class:"card center"},[
        h("p",{class:"muted"},["Oficina não encontrada para o código \""+route.code+"\"."]),
        h("a",{class:"btn secondary", href: route.view==="palco"?"#palco":"#entrar", style:"margin-top:12px;display:inline-block;width:auto"},["Voltar"])
      ]));
      root.appendChild(w);
      return;
    }
    else if(!currentSession || currentSession.code!==route.code){
      root.appendChild(brandBar());
      root.appendChild(h("div",{class:"wrap center", style:"padding-top:30vh"},[h("span",{class:"muted"},["Carregando oficina…"])]));
      openSession(route.code, function(){ render(); });
      return;
    }
  }

  if(route.view==="palco") renderStage(route.code);
  else renderEntrar(route.code);
}
window.addEventListener("hashchange", render);

// resolve um código de oficina em currentSession (ou null se não existir),
// (re)assina o canal realtime correspondente e chama done() ao concluir
function openSession(code, done){
  sb.from("oficina_rede_sessions").select("*").eq("code",code).maybeSingle().then(function(res){
    if(res.error || !res.data){
      currentSession=null; notFoundCode=code;
      if(done) done(null);
      return;
    }
    notFoundCode=null;
    if(!currentSession || currentSession.code!==code){ resetSim(); selectedKey=null; posCache={}; }
    currentSession={id:res.data.id, code:res.data.code, name:res.data.name, phase:res.data.phase||"coleta"};
    subscribeSession();
    if(done) done(currentSession);
  });
}

// muitos celulares recebem o mesmo evento ao mesmo tempo: cada um espera um tempo curto e aleatório
// e as atualizações seguidas viram uma só (evita tempestade de consultas e telas piscando)
function onChange(){
  var onStage = parseHash().view==="palco";
  scheduleLoad(onStage? 400 : 300+Math.random()*1500);
}

function subscribeSession(){
  if(sessionChannel){ sb.removeChannel(sessionChannel); sessionChannel=null; }
  if(!currentSession) return;
  loadAll();
  sessionChannel=sb.channel("oficina-rede-session-"+currentSession.id)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_participants", filter:"session_id=eq."+currentSession.id}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_ties", filter:"session_id=eq."+currentSession.id}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_memberships", filter:"session_id=eq."+currentSession.id}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"oficina_rede_sessions", filter:"id=eq."+currentSession.id}, onChange)
    .subscribe();
}

// ---- celular: "indique a(s) rede(s) de EA a(s) qual(is) você está vinculado(a)" ----
function renderVinculosForm(wrap, myId){
  var sid=currentSession.id;
  var card=h("div",{class:"card"});
  card.appendChild(h("h3",{style:"font-size:17px;margin-bottom:6px"},["Indique a(s) rede(s) de EA a(s) qual(is) você está vinculado(a)"]));
  card.appendChild(h("p",{class:"muted",style:"margin-bottom:10px;font-size:13px"},["Digite parte do nome ou da sigla e escolha na lista. Pode indicar mais de uma. Se a sua rede não aparecer, adicione-a."]));
  var input=h("input",{type:"text", id:"ofNet", value:draft.net, autocomplete:"off", placeholder:"Ex.: REPEA, Bahia, juventude…", oninput:function(){ draft.net=input.value; refresh(); }});
  card.appendChild(input);
  var results=h("div",{});
  card.appendChild(results);
  var chosenBox=h("div",{style:"margin-top:14px"});
  card.appendChild(chosenBox);
  wrap.appendChild(card);

  function mine(){ return state.memberships.filter(function(m){ return m.participantId===myId; }); }
  function hasKey(k){ return mine().some(function(m){ return m.key===k; }); }

  function addMembership(key, name, listed){
    if(hasKey(key)) return;
    var tmp={id:"tmp-"+key, participantId:myId, key:key, name:name, listed:listed};
    state.memberships.push(tmp);
    draft.net=""; input.value="";
    drawChosen(); refresh();
    sb.from("oficina_rede_memberships").insert({session_id:sid, participant_id:myId, network_key:key, network_name:name, listed:listed}).then(function(res){
      if(res.error && String(res.error.code)!=="23505"){
        state.memberships=state.memberships.filter(function(m){ return m!==tmp; });
        drawChosen(); refresh(); toast("Não foi possível salvar: "+res.error.message);
      } else { loadAll(); }
    });
  }
  function removeMembership(m){
    state.memberships=state.memberships.filter(function(x){ return x!==m; });
    drawChosen(); refresh();
    if(String(m.id).indexOf("tmp-")===0) return;
    sb.from("oficina_rede_memberships").delete().eq("id", m.id).then(function(res){
      if(res.error){ toast("Não foi possível remover: "+res.error.message); }
      loadAll();
    });
  }
  function otherNetworks(){   // redes "outras" já digitadas por alguém da sala
    var seen={}, out=[];
    state.memberships.forEach(function(m){ if(!m.listed && !seen[m.key]){ seen[m.key]=1; out.push({key:m.key, label:m.name}); } });
    return out;
  }
  function refresh(){
    results.innerHTML="";
    var q=normName(input.value);
    if(q.length<1) return;
    var pool=[{key:REBEA_ITEM.key, label:REBEA_ITEM.label, nome:REBEA_ITEM.nome, listed:true}].concat(REDES_LISTA.map(function(r){ return {key:r.key, label:r.label, nome:r.nome, listed:true}; }))
      .concat(otherNetworks().map(function(o){ return {key:o.key, label:o.label, nome:o.label, listed:false}; }));
    var hits=pool.filter(function(r){ return !hasKey(r.key) && (normName(r.label).indexOf(q)>=0 || normName(r.nome).indexOf(q)>=0); });
    hits.sort(function(a,b){
      var pa=normName(a.label).indexOf(q)===0?0:1, pb=normName(b.label).indexOf(q)===0?0:1;
      if(a.key==="rebea") return -1; if(b.key==="rebea") return 1;
      return pa-pb || a.label.localeCompare(b.label);
    });
    hits.slice(0,8).forEach(function(r){
      var kids=[h("b",{},[r.label])];
      if(normName(r.nome)!==normName(r.label)) kids.push(h("small",{},[r.nome]));
      results.appendChild(h("button",{class:"net-opt", onclick:function(){ addMembership(r.key, r.label, r.listed); }}, kids));
    });
    var raw=input.value.trim().replace(/\s+/g," ");
    var exact=pool.some(function(r){ return normName(r.label)===q || normName(r.nome)===q; });
    if(raw.length>=2 && !exact && hits.length<5){
      results.appendChild(h("button",{class:"net-opt add", onclick:function(){
        var val=raw, key=normName(val);
        var known=pool.map(function(r){ return r.label; });
        var sug=suggestSimilarName(val, known);
        if(sug){
          if(confirm("Já existe \""+sug+"\" na lista.\n\nÉ a mesma rede?\n\nOK = sim, é \""+sug+"\"\nCancelar = não, é outra (\""+val+"\")")){
            var r=pool.filter(function(x){ return x.label===sug; })[0];
            if(r){ addMembership(r.key, r.label, r.listed); return; }
          }
        }
        addMembership("x:"+key, val, false);
      }},[h("span",{},["+ Adicionar “"+raw+"” (outra rede)"])]));
    }
  }
  function drawChosen(){
    chosenBox.innerHTML="";
    var list=mine();
    if(!list.length){ chosenBox.appendChild(h("p",{class:"muted",style:"font-size:12px"},["Nenhuma rede indicada ainda."])); return; }
    chosenBox.appendChild(h("label",{},["Redes que você indicou"]));
    list.forEach(function(m){
      var chip=h("span",{class:"chip"},[m.name]);
      chip.appendChild(h("button",{title:"Remover","aria-label":"Remover "+m.name,onclick:function(){ removeMembership(m); }},["×"]));
      chosenBox.appendChild(chip);
    });
    chosenBox.appendChild(h("p",{class:"muted",style:"font-size:12px;margin-top:10px"},["Pronto! Pode indicar outras ou aguardar o início da próxima etapa."]));
  }
  drawChosen(); refresh();
}

// tela sem código: escolher uma oficina existente ou criar uma nova (só facilitador)
// apaga uma oficina inteira (dados + a própria sessão); afterDelete(err) é chamado
// ao final para quem precisar reagir (ex.: voltar para a lista de oficinas)
function deleteSession(s, triggerBtn, afterDelete){
  if(!confirm("Excluir a oficina \""+(s.name||s.code)+"\" e todos os seus dados (participantes e laços)? Isso não pode ser desfeito.")) return;
  if(triggerBtn) triggerBtn.disabled=true;
  Promise.all([
    sb.from("oficina_rede_ties").delete().eq("session_id", s.id),
    sb.from("oficina_rede_memberships").delete().eq("session_id", s.id),
    sb.from("oficina_rede_participants").delete().eq("session_id", s.id)
  ]).then(function(results){
    var err=results.find(function(r){return r.error;});
    if(err) return {error:err.error};
    return sb.from("oficina_rede_sessions").delete().eq("id", s.id);
  }).then(function(res){
    if(triggerBtn) triggerBtn.disabled=false;
    if(res.error){ toast("Erro ao excluir: "+res.error.message); if(afterDelete) afterDelete(res.error); return; }
    toast("Oficina excluída.");
    sessionsListLoaded=false;
    if(currentSession && currentSession.id===s.id){
      if(sessionChannel){ sb.removeChannel(sessionChannel); sessionChannel=null; }
      currentSession=null;
    }
    if(afterDelete) afterDelete(null); else render();
  });
}

// posiciona os nós para os layouts clássicos não-orgânicos: fixa x/y/fx/fy de
// cada nó antes da simulação começar. Para "force", não mexe em nada — a
// simulação orgânica de sempre decide as posições. Para "circular"/"radial",
// os nós ficam pinados na posição calculada (ainda dá pra arrastar à mão,
// igual já funciona em "force").
// adjacência só com laços reais (mesmo critério do grau estrutural) — usada
// para agrupar/organizar os layouts "Circular" e "Radial" por quem está de
// fato ligado a quem, não por acaso de laços hipotéticos
function buildRealAdjacency(nodeArr, linkArr){
  var adj={};
  nodeArr.forEach(function(d){ adj[d.key]=[]; });
  linkArr.forEach(function(e){
    if(!e.real) return;
    if(adj[e.source] && adj[e.target]){ adj[e.source].push(e.target); adj[e.target].push(e.source); }
  });
  return adj;
}

// componentes conectados (grupos) a partir da adjacência — para agrupar nós
// do mesmo grupo lado a lado, em vez de espalhar tudo ao acaso
function connectedComponents(nodeArr, adj){
  var compOf={}, comps=[];
  nodeArr.forEach(function(d){
    if(compOf[d.key]!=null) return;
    var idx=comps.length, queue=[d.key], members=[];
    compOf[d.key]=idx;
    while(queue.length){
      var k=queue.shift(); members.push(k);
      (adj[k]||[]).forEach(function(nb){
        if(compOf[nb]==null){ compOf[nb]=idx; queue.push(nb); }
      });
    }
    comps.push(members);
  });
  return comps;
}

// árvore radial por distância (BFS) a partir de um nó-hub: cada "anel" é uma
// distância de laços até o hub, e os nós de cada anel ficam dentro da fatia
// angular herdada do pai — é o espírito do Radial Axis Layout do Gephi
function radialTreePositions(members, adj, hubKey, cx, cy, maxRadius){
  var inGroup={}; members.forEach(function(k){ inGroup[k]=true; });
  var dist={}, parent={}, order=[hubKey];
  dist[hubKey]=0; parent[hubKey]=null;
  for(var qi=0; qi<order.length; qi++){
    var cur=order[qi];
    (adj[cur]||[]).forEach(function(nb){
      if(inGroup[nb] && dist[nb]==null){ dist[nb]=dist[cur]+1; parent[nb]=cur; order.push(nb); }
    });
  }
  var maxRing=0; order.forEach(function(k){ if(dist[k]>maxRing) maxRing=dist[k]; });
  var ringGap = maxRing>0 ? maxRadius/maxRing : maxRadius;
  var wedge={}; wedge[hubKey]={start:0,end:2*Math.PI};
  var pos={}; pos[hubKey]={x:cx,y:cy};
  for(var r=1;r<=maxRing;r++){
    var byParent={};
    order.forEach(function(k){
      if(dist[k]===r){ var p=parent[k]; (byParent[p]=byParent[p]||[]).push(k); }
    });
    Object.keys(byParent).forEach(function(p){
      var kids=byParent[p], pw=wedge[p]||{start:0,end:2*Math.PI};
      var span=pw.end-pw.start, step=span/kids.length;
      kids.forEach(function(k,i){
        var a0=pw.start+i*step, a1=a0+step, ang=(a0+a1)/2;
        wedge[k]={start:a0,end:a1};
        var rad=r*ringGap;
        pos[k]={x:cx+rad*Math.cos(ang-Math.PI/2), y:cy+rad*Math.sin(ang-Math.PI/2)};
      });
    });
  }
  return pos;
}

function layoutPositions(nodeArr, linkArr, layout, w, hgt){
  var n=nodeArr.length;
  if(n===0 || layout==="force") return;
  var cx=w/2, cy=hgt/2;
  var byKey={}; nodeArr.forEach(function(d){ byKey[d.key]=d; });
  var adj=buildRealAdjacency(nodeArr, linkArr);
  var comps=connectedComponents(nodeArr, adj)
    .sort(function(a,b){ return b.length-a.length; });

  if(layout==="circular"){
    // agrupa por grupo conectado (maior grupo primeiro) e, dentro de cada
    // grupo, por quem tem mais laços — grupos ficam em arcos contíguos
    var order=[];
    comps.forEach(function(members){
      members.map(function(k){ return byKey[k]; })
        .sort(function(a,b){ return b.degree-a.degree || a.label.localeCompare(b.label); })
        .forEach(function(d){ order.push(d); });
    });
    var radius=Math.max(60, Math.min(w,hgt)*0.38);
    order.forEach(function(d,i){
      var angle=(i/n)*2*Math.PI - Math.PI/2;
      d.x=d.fx=cx+radius*Math.cos(angle);
      d.y=d.fy=cy+radius*Math.sin(angle);
    });
  } else if(layout==="radial"){
    // grupo principal: árvore radial a partir do nó com mais laços reais,
    // em anéis por distância. Grupos menores (ou pessoas isoladas) orbitam
    // como satélites ao redor, cada um com sua própria mini-árvore radial
    var mainRadius=Math.max(80, Math.min(w,hgt)*0.42);
    var mainComp=comps[0]||[];
    if(mainComp.length){
      var hub=mainComp.map(function(k){return byKey[k];})
        .sort(function(a,b){ return b.degree-a.degree || a.label.localeCompare(b.label); })[0];
      var mainPos=radialTreePositions(mainComp, adj, hub.key, cx, cy, mainRadius);
      mainComp.forEach(function(k){
        var p=mainPos[k]; byKey[k].x=byKey[k].fx=p.x; byKey[k].y=byKey[k].fy=p.y;
      });
    }
    var satellites=comps.slice(1);
    var satRadius=Math.min(w,hgt)*0.14;
    var satOrbit=mainRadius + satRadius + 46;
    satellites.forEach(function(members, i){
      var angle=(i/Math.max(1,satellites.length))*2*Math.PI - Math.PI/2;
      var scx=cx+satOrbit*Math.cos(angle), scy=cy+satOrbit*Math.sin(angle);
      var subHub=members.map(function(k){return byKey[k];})
        .sort(function(a,b){ return b.degree-a.degree || a.label.localeCompare(b.label); })[0];
      var subPos=radialTreePositions(members, adj, subHub.key, scx, scy, satRadius);
      members.forEach(function(k){
        var p=subPos[k]; byKey[k].x=byKey[k].fx=p.x; byKey[k].y=byKey[k].fy=p.y;
      });
    });
  }
}

function drawGraph(container, g, onNodeClick, layout, opts){
  if(!window.d3){ container.innerHTML="<div class='muted' style='padding:20px'>Biblioteca de grafo indisponível.</div>"; return; }
  var w=container.clientWidth||800, hgt=container.clientHeight||600;
  var svg=d3.select(container).append("svg").attr("width",w).attr("height",hgt).attr("viewBox","0 0 "+w+" "+hgt);
  svg.style("cursor","grab");

  var defs=svg.append("defs");
  var glow=defs.append("filter").attr("id","nodeglow").attr("x","-100%").attr("y","-100%").attr("width","300%").attr("height","300%");
  glow.append("feGaussianBlur").attr("stdDeviation","4").attr("result","b");
  var merge=glow.append("feMerge"); merge.append("feMergeNode").attr("in","b"); merge.append("feMergeNode").attr("in","SourceGraphic");

  var nodeArr=Object.keys(g.nodes).map(function(k){ return g.nodes[k]; });
  var linkArr=g.edges.map(function(e){ return {source:e.a, target:e.b, a:e.a, b:e.b, key:e.key, real:e.real, hyp:e.hyp, st:e.st||"kept"}; });

  if(nodeArr.length===0){
    svg.append("text").attr("x",w/2).attr("y",hgt/2).attr("text-anchor","middle")
      .attr("fill","#B9CBDD").attr("font-family","Poppins").attr("font-size","16px")
      .text("Aguardando participantes…");
    return;
  }

  layoutPositions(nodeArr, linkArr, layout||"force", w, hgt);
  var warm=false;
  if((layout||"force")==="force") nodeArr.forEach(function(d){ var p=posCache[d.key]; if(p){ d.x=p.x; d.y=p.y; warm=true; } });

  // everything pannable/zoomable lives inside "viewport"; defs/filters stay outside it
  var viewport=svg.append("g").attr("class","viewport");

  // simulação no estilo ForceAtlas2 (o layout "orgânico" padrão do Gephi):
  // repulsão mais forte em quem tem mais laços (hubs abrem espaço ao redor),
  // uma gravidade fraca (em vez de recentralizar a massa a cada tick) puxando
  // tudo de volta para o meio, e menos decaimento para espalhar melhor antes
  // de assentar. Nós travados pelos layouts Circular/Radial (fx/fy) ignoram
  // essas forças normalmente.
  function rOf(d){ return 9+Math.min(14,d.degree*2.5); }
  var sim=d3.forceSimulation(nodeArr)
    .force("link", d3.forceLink(linkArr).id(function(d){return d.key;})
      .distance(function(l){ return l.hyp? 130 : 85; })
      .strength(function(l){ return l.hyp? 0.2 : 0.5; }))
    .force("charge", d3.forceManyBody().strength(function(d){ return -220-d.degree*55; }).distanceMax(700))
    .force("x", d3.forceX(w/2).strength(0.025))
    .force("y", d3.forceY(hgt/2).strength(0.025))
    .force("collide", d3.forceCollide(function(d){ return rOf(d)+14; }).iterations(2))
    .alphaDecay(0.015)
    .velocityDecay(0.35);
  if(warm) sim.alpha(0.15);

  var link=viewport.append("g").selectAll("line").data(linkArr).enter().append("line")
    .attr("stroke", function(d){ return d.st==="cut"? "#FF6B6B" : (d.st==="added"? "#FFC24D" : "#5FE0C6"); })
    .attr("stroke-width", function(d){ return d.st==="added"? 1.8 : 2; })
    .attr("stroke-dasharray", function(d){ return d.st==="cut"? "5 5" : (d.st==="added"? "6 5" : null); })
    .attr("opacity", function(d){ return d.st==="cut"? .65 : .85; })
    .style("pointer-events","none");
  // área de clique mais larga para retirar/restaurar um laço direto no grafo (só o facilitador, na simulação)
  var hitSel=null;
  if(opts&&opts.canEdit){
    hitSel=viewport.append("g").selectAll("line").data(linkArr).enter().append("line")
      .attr("stroke","transparent").attr("stroke-width",14).style("cursor","pointer")
      .on("click", function(event,d){ event.stopPropagation(); if(opts.onEdge) opts.onEdge(d.key); });
    hitSel.append("title").text(function(d){ return d.st==="cut"? "Clique para restaurar este laço" : "Clique para retirar este laço"; });
  }

  var node=viewport.append("g").selectAll("g").data(nodeArr).enter().append("g")
    .style("cursor","pointer");

  // três níveis de presença, coerentes com a dinâmica da oficina (nem todo
  // mundo tem celular na mão), diferenciados por COR (sem poluir o nome com
  // tag): "confirmado" (entrou pelo próprio #entrar) — verde-água, com
  // brilho; "indicado" (alguém da sala marcou "Nesta sala" ao lançar um laço
  // para essa pessoa, mas ela mesma não entrou) — lilás, sem brilho; "fora"
  // (declarado fora, ou nunca mencionado como presente) — bolinha vazada,
  // borda tracejada, nome em itálico + "(fora)" (esse sim precisa do texto,
  // já que é quase invisível).
  function presenceOf(d){ return d.selfJoined? "confirmed" : (d.inRoom? "declared" : "out"); }
  function presenceFill(d){
    var p=presenceOf(d);
    return p==="confirmed"? "#5FE0C6" : (p==="declared"? "#B9A6FF" : "rgba(63,111,134,.3)");
  }

  var critMap=(opts&&opts.crit)||{}, showCrit=!!(opts&&opts.show);
  function critOf(d){ var c=critMap[d.key]; return (c&&c.primary)? c.primary : ""; }
  // anel do nó: selecionado (âmbar) > crítico (cor do tipo, quando o destaque está ligado) > fora da sala (tracejado)
  function ringOf(d){
    if(selectedKey===d.key) return {c:"#FFC24D", w:3, dash:null};
    var cp=showCrit? critOf(d) : "";
    if(cp) return {c:CRIT[cp].color, w:4.5, dash:null};
    if(d.ghost) return {c:"#FF6B6B", w:1.6, dash:"3 3"};
    return presenceOf(d)==="out"? {c:"#B9CBDD", w:1.6, dash:"4 3"} : {c:"none", w:0, dash:null};
  }
  function dimmed(d){ return d.ghost || (showCrit && !critOf(d)); }

  node.append("circle")
    .attr("r", rOf)
    .attr("fill", presenceFill)
    .attr("filter", function(d){ return presenceOf(d)==="confirmed"? "url(#nodeglow)" : null; })
    .attr("stroke", function(d){ return ringOf(d).c; })
    .attr("stroke-width", function(d){ return ringOf(d).w; })
    .attr("stroke-dasharray", function(d){ return ringOf(d).dash; })
    .attr("opacity", function(d){ return d.ghost? .25 : (dimmed(d)? .35 : 1); });

  node.append("text")
    .text(function(d){ var cp=showCrit? critOf(d) : ""; return (cp? CRIT[cp].icon+" " : "") + d.label + (d.ghost? " (retirada)" : (presenceOf(d)==="out"? " (fora)" : "")); })
    .attr("opacity", function(d){ return d.ghost? .45 : (dimmed(d)? .45 : 1); })
    .attr("text-anchor","middle")
    .attr("dy", function(d){ return -(14+Math.min(14,d.degree*2.5)); })
    .attr("fill", function(d){ return presenceOf(d)==="confirmed"? "#fff" : "#B9CBDD"; })
    .attr("font-family","Poppins").attr("font-weight", function(d){ return (showCrit && critOf(d))? "700" : "600"; })
    .attr("font-style", function(d){ return presenceOf(d)==="out"? "italic" : "normal"; })
    .attr("font-size","12px")
    .style("pointer-events","none");

  // pan + zoom on the whole canvas (mouse wheel / pinch / drag on empty space)
  var zoom=d3.zoom().scaleExtent([0.3,4]).on("zoom", function(event){
    viewport.attr("transform", event.transform);
  });
  svg.call(zoom);
  svg.on("dblclick.zoom", null);
  svg.on("dblclick", function(){
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
  });

  // drag individual nodes to reorganize the layout by hand; a dropped node stays
  // pinned where you left it (the rest of the graph keeps simulating around it)
  var drag=d3.drag()
    .on("start", function(event,d){
      if(!event.active) sim.alphaTarget(0.25).restart();
      d.fx=d.x; d.fy=d.y; d.__dragged=false;
      svg.style("cursor","grabbing");
    })
    .on("drag", function(event,d){
      d.fx=event.x; d.fy=event.y; d.__dragged=true;
    })
    .on("end", function(event,d){
      sim.alphaTarget(0);
      svg.style("cursor","grab");
    });
  node.call(drag);

  node.on("click", function(event,d){
    if(d.__dragged){ d.__dragged=false; return; }
    event.stopPropagation();
    selectedKey=d.key;
    node.select("circle")
      .attr("stroke", function(dd){ return ringOf(dd).c; })
      .attr("stroke-width", function(dd){ return ringOf(dd).w; })
      .attr("stroke-dasharray", function(dd){ return ringOf(dd).dash; });
    if(typeof onNodeClick==="function") onNodeClick(d.key);
  });

  var hint=document.createElement("div");
  hint.className="graph-hint";
  hint.textContent="Arraste os nós para reorganizar · role para zoom · duplo clique para centralizar";
  container.appendChild(hint);

  sim.on("tick", function(){
    nodeArr.forEach(function(d){
      var r=rOf(d)+4;
      if(d.fx==null) d.x=Math.max(r, Math.min(w-r, d.x));
      if(d.fy==null) d.y=Math.max(r, Math.min(hgt-r, d.y));
    });
    nodeArr.forEach(function(d){ posCache[d.key]={x:d.x,y:d.y}; });
    link.attr("x1",function(d){return d.source.x;}).attr("y1",function(d){return d.source.y;})
        .attr("x2",function(d){return d.target.x;}).attr("y2",function(d){return d.target.y;});
    if(hitSel) hitSel.attr("x1",function(d){return d.source.x;}).attr("y1",function(d){return d.source.y;})
        .attr("x2",function(d){return d.target.x;}).attr("y2",function(d){return d.target.y;});
    node.attr("transform", function(d){ return "translate("+d.x+","+d.y+")"; });
  });
}

// ---------- data wiring ----------
// local, per-browser id, por oficina — participantes nunca fazem login; é assim
// que "quem sou eu" persiste, sem misturar a mesma pessoa entre oficinas diferentes
function localId(code){
  var k="oficina_rede_my_id:"+(code||"_global");
  var v=localStorage.getItem(k);
  if(!v){
    v=(window.crypto&&crypto.randomUUID)? crypto.randomUUID() : ("id-"+Math.random().toString(36).slice(2)+Date.now());
    localStorage.setItem(k,v);
  }
  return v;
}

// reescreve participante(s) e laços cujo nome normaliza para sourceKey, usando
// canonicalLabel como grafia final — assim os dois nós viram um só no grafo
function mergeNodes(sourceKey, canonicalLabel){
  var ops=[];
  state.participants.forEach(function(p){
    if(normName(p.name)===sourceKey && p.name!==canonicalLabel){
      ops.push(sb.from("oficina_rede_participants").update({name:canonicalLabel}).eq("id",p.id));
    }
  });
  state.ties.forEach(function(t){
    if(normName(t.fromName)===sourceKey && t.fromName!==canonicalLabel){
      ops.push(sb.from("oficina_rede_ties").update({from_name:canonicalLabel}).eq("id",t.id));
    }
    if(normName(t.to)===sourceKey && t.to!==canonicalLabel){
      ops.push(sb.from("oficina_rede_ties").update({to_name:canonicalLabel}).eq("id",t.id));
    }
  });
  return Promise.all(ops).then(function(results){
    var err=results.find(function(r){ return r && r.error; });
    if(err) throw err.error;
  });
}

// uma consulta por vez (se chegar outra enquanto isso, roda de novo no fim), com atraso opcional
function scheduleLoad(delay){
  if(loadTimer) return;
  loadTimer=setTimeout(function(){ loadTimer=null; runLoad(); }, delay==null? 350 : delay);
}
function runLoad(){
  if(loading){ loadAgain=true; return Promise.resolve(); }
  loading=true;
  return loadCore().catch(function(e){ console.error("load",e); }).then(function(){
    loading=false;
    if(loadAgain){ loadAgain=false; scheduleLoad(150); }
  });
}
function loadAll(){ return runLoad(); }

async function loadCore(){
  if(!currentSession){ state.participants=[]; state.ties=[]; state.loaded=true; render(); return; }
  var sid=currentSession.id;
  var res3=await Promise.all([
    sb.from("oficina_rede_participants").select("*").eq("session_id",sid),
    sb.from("oficina_rede_ties").select("*").eq("session_id",sid),
    sb.from("oficina_rede_sessions").select("*").eq("id",sid).maybeSingle(),
    sb.from("oficina_rede_memberships").select("*").eq("session_id",sid)
  ]);
  var p=res3[0], t=res3[1], s=res3[2], mb=res3[3];
  if(!currentSession || currentSession.id!==sid) return; // trocou de oficina durante a consulta
  if(p.error) console.error("participants",p.error);
  else state.participants=p.data.map(function(r){ return {id:r.id, name:r.name}; });
  if(t.error) console.error("ties",t.error);
  else state.ties=t.data.map(function(r){ return {
    id:r.id, from:r.from_id, fromName:r.from_name, to:r.to_name,
    external:!!r.external, hypothetical:!!r.hypothetical, createdAt:r.created_at
  }; });
  if(mb && mb.error) console.error("memberships",mb.error);
  else if(mb) state.memberships=mb.data.map(function(r){ return {id:r.id, participantId:r.participant_id, key:r.network_key, name:r.network_name, listed:!!r.listed}; });
  if(!s.error && s.data){
    currentSession.phase=s.data.phase||"coleta";
    currentSession.name=s.data.name;
    state.phase=currentSession.phase;
  }
  state.loaded=true;
  // na entrada do participante, só refaz a tela se algo que ELE vê mudou (ele mesmo, seus laços, a fase);
  // quando outras pessoas agem, só atualiza a lista de sugestões e deixa o formulário em paz
  var rt=parseHash();
  if(rt.view==="entrar" && rt.code && renderedKey==="entrar|"+rt.code && entrarSig()===lastEntrarSig){
    refreshDatalist();
    return;
  }
  render();
}

async function init(){
  try{
    if(window.supabase && SUPABASE_URL.indexOf("__")!==0){
      sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      var sess=await sb.auth.getSession();
      isAdmin=!!(sess && sess.data && sess.data.session);
      sb.auth.onAuthStateChange(function(event, session){ isAdmin=!!session; sessionsListLoaded=false; render(); });
    }
  }catch(e){ sb=null; }
  if(!location.hash) location.hash="#entrar";
  render();
}
init();

})();
